services:
  ml-service:
    build:
      # Repo root: the image needs training/stroke_encoder/prep.py too.
      context: .
      dockerfile: ml-service/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/debug:/app/debug
    environment:
      - ML_DEBUG=${ML_DEBUG:-false}
