[project]
name = "ml-service"
version = "0.1.0"
description = "Handwriting transcription service for notes-organizer"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "flask-cors",
    "torch",
    "transformers",
    "sentence-transformers",
    "pillow",
    "opencv-python-headless",
    "sentencepiece>=0.2.2",
    "protobuf>=7.35.1",
]

[dependency-groups]
# Test/eval tooling; excluded from the Docker image via `uv sync --no-dev`
dev = [
    "pytest",
    "jiwer",
    "datasets",
]

[tool.uv]
# Dependency manifest only
package = false

# CPU-only torch
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
